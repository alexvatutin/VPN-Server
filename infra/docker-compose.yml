version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: vpn
      POSTGRES_DB: vpn
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://vpn:vpn@db:5432/vpn
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_API_KEY: ${YOOKASSA_API_KEY}
      YOOKASSA_WEBHOOK_SECRET: ${YOOKASSA_WEBHOOK_SECRET}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      - db

  bot:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://vpn:vpn@db:5432/vpn
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_API_KEY: ${YOOKASSA_API_KEY}
      YOOKASSA_WEBHOOK_SECRET: ${YOOKASSA_WEBHOOK_SECRET}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
    depends_on:
      - db
    ports:
      - "8081:8081"

volumes:
  db_data:
